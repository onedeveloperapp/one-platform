name: Deploy

# Deploys apps/web to Vercel through the Vercel CLI (token-based), never the
# Vercel Git integration — the project stays disconnected from GitHub on the
# Vercel side (multiple GitHub accounts on the owner's machine conflict with it).
#
# The compile runs on Vercel's cloud build (not `--prebuilt` on the runner):
# Vercel's build environment natively resolves the npm-workspace packages
# (@flyee/*), which the runner-side `vercel build --prebuilt` flow breaks by
# isolating the build to the Root Directory (apps/web) and severing the
# ../../packages/* symlinks. Env vars come from the Vercel project settings.
# Setup and secrets: docs/DEPLOY.md.
#
# push to main                 → production deploy
# pull_request                 → preview deploy (URL in the run summary)
# manual dispatch              → production by default, preview when chosen
#
# The same flow as MedChina's (decided by the owner on 2026-10-21, when the
# ONE repository onedeveloperapp/one-platform and its Vercel project were made).

# Deploys only what ships to Vercel (apps/web + the packages it imports).
# Pushes/PRs that touch ONLY the paths below skip the deploy — GitHub runs the
# job only when at least one changed file is NOT in paths-ignore. Workflow edits
# (.github/**) still trigger, so a pipeline change is always exercised.
#
# A preview address is served by Vercel with `noindex` and can sit behind its
# deployment protection. Production is a public, indexable address.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - "attachments/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".agents/**"
      - ".codex/**"
      - "attachments/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Onde publicar: production ou preview (teste, fora dos buscadores)"
        type: choice
        options:
          - production
          - preview
        default: production

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Preview deploy
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target != 'production')
    runs-on: ubuntu-latest
    # `vercel deploy` BLOCKS until the cloud build finishes, so this ceiling is
    # really "how long may a Vercel build take". At 30m the runner killed the
    # job while the build was still running on Vercel — the deployment itself
    # was never cancelled, only our wait for it, which reported a false failure.
    timeout-minutes: 60
    concurrency:
      group: vercel-preview-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets — see docs/DEPLOY.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Deploy preview (Vercel cloud build)
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "Preview: $url"
          echo "### Vercel preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production deploy
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    # `vercel deploy` BLOCKS until the cloud build finishes, so this ceiling is
    # really "how long may a Vercel build take". At 30m the runner killed the
    # job while the build was still running on Vercel — the deployment itself
    # was never cancelled, only our wait for it, which reported a false failure.
    timeout-minutes: 60
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets — see docs/DEPLOY.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Deploy to production (Vercel cloud build)
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "Production: $url"
          echo "### Vercel production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      # Inngest holds no function of ONE since 2026-11-14 (the clock moved to
      # ONE's own server, below). The sync tells it so: a runner synced with a
      # function it no longer finds keeps calling the route. A PUT to the serve
      # route is the dashboard's "Sync", sent to the public production address
      # (a deployment's own address sits behind Vercel's login). A sync that
      # fails warns and leaves the deploy as it went.
      - name: Sync the jobs with Inngest
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://one-platform-two.vercel.app' }}
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o sync.json -w '%{http_code}' -X PUT "$PRODUCTION_URL/api/inngest" --max-time 60 || echo 000)
            if [ "$code" = "200" ]; then
              echo "Inngest: $(cat sync.json)"
              echo "Inngest sync: $(cat sync.json)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Inngest sync, attempt $attempt: HTTP $code $(cat sync.json 2>/dev/null)"
            sleep 15
          done
          echo "::warning::Inngest was not synced: sync the app at $PRODUCTION_URL/api/inngest (docs/DEPLOY.md)"
          echo "Inngest sync failed: see this step's log" >> "$GITHUB_STEP_SUMMARY"
      # The platform's one clock (apps/web/clock/) runs on ONE's own server,
      # from this same commit (the owner, 2026-11-14: its beats were most of
      # what Vercel's plan allows). Bundled here, received there by
      # receber.sh, the one command this key may run: it tries the version
      # with the server's keys and puts it in the place of the running clock
      # once the beat under way ends. Without the key the step fails, the
      # deploy above stands, and the app runs its own rounds while ONE is used
      # until the clock beats again (lib/jobs/while-used.ts).
      - name: Ship the clock to ONE's server
        env:
          CLOCK_KEY: ${{ secrets.ONE_VPS_CLOCK_KEY }}
          KNOWN_HOSTS: ${{ vars.ONE_VPS_KNOWN_HOSTS }}
          VPS: ${{ vars.ONE_VPS_SSH || 'one@187.53.106.93' }}
        run: |
          if [ -z "$CLOCK_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Missing ONE_VPS_CLOCK_KEY / ONE_VPS_KNOWN_HOSTS: the clock was not updated (docs/DEPLOY.md)"
            exit 1
          fi
          npm ci --no-audit --no-fund
          node apps/web/clock/build.mjs
          install -m 700 -d ~/.ssh
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "$CLOCK_KEY" > ~/.ssh/relogio
          chmod 600 ~/.ssh/relogio
          tar -C apps/web/clock/dist -cz . | ssh -i ~/.ssh/relogio -o BatchMode=yes "$VPS" "$GITHUB_SHA"
          echo "Clock: $GITHUB_SHA on ONE's server" >> "$GITHUB_STEP_SUMMARY"
