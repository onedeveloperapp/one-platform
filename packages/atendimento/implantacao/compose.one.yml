# O ONE na VPS dividida com o Orkestree: o Chatwoot, o Postgres e o Redis, e o OpenWA para os números que um
# escritório liga pelo WhatsApp Web (a conexão não oficial, escolha do escritório; o dono, 2026-11-11). O robô do
# kit nunca sobe aqui: o ONE responde com a própria IA, e o OpenWA fala com o ONE (o webhook de cada sessão vai ao
# ONE, assinado), nunca com o Chatwoot. Vai por cima de compose.yml e compose.compartilhado.yml (COMPOSE_FILE no
# .env da pilha); o perfil abaixo não é ligado por ninguém.

services:
  robo:
    profiles: ["fora-do-one"]

  # O tema do kit e o acréscimo do ONE (painel-acrescimo.html), juntos por pilha-one.sh em gerado/painel-one.html.
  chatwoot-config:
    environment:
      KIT_DASHBOARD_SCRIPTS_FILE: /kit/gerado/painel-one.html
