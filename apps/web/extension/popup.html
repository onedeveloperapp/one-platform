<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ONE · Protocolo nos tribunais</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d2433;
        --muted: #5b6475;
        --line: #d9dde5;
        --accent: #2f5bd3;
        --ground: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e8ebf2;
          --muted: #a5adbd;
          --line: #353c4a;
          --accent: #7c9cff;
          --ground: #161a22;
        }
      }
      body {
        margin: 0;
        width: 320px;
        font:
          14px/1.45 system-ui,
          sans-serif;
        color: var(--text);
        background: var(--ground);
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
      }
      p {
        margin: 0;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .counts {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
      }
      button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ONE · Mapear as telas do tribunal</h1>
      <p id="where"></p>
      <section id="court" class="row" hidden>
        <button id="map" class="primary" type="button">Mapear esta tela</button>
        <button id="record" type="button">Gravar o caminho</button>
      </section>
      <p id="said" role="status"></p>
      <div class="counts">
        <p id="counts"></p>
      </div>
      <div class="row">
        <button id="download" type="button">Baixar o mapa</button>
        <button id="clear" type="button">Apagar o mapa</button>
      </div>
      <p class="muted">
        O mapa guarda os nomes dos campos, das listas e dos botões, nunca o que está escrito neles. Nada sai do seu
        computador: o arquivo é baixado e você o envia ao ONE.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
